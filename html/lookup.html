<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>The Majewski Collection Lookup</title>
    <link
      rel="stylesheet"
      href="../stylesheets/style.css"
    />
    <link
      rel="stylesheet"
      href="../stylesheets/lookup.css"
    />
    <script
      type="module"
      src="../renderer.js"
      defer
    ></script>
  </head>
  <body id="lookup-body">
    <header>
      <img
        src="../assets/tmc_logo.png"
        alt="the majewski collection"
      />
      <h1>Lookup</h1>
      <button
        commandfor="help-dialog"
        command="show-modal"
        id="btn-help"
      ></button>
      <dialog
        closedby="any"
        id="help-dialog"
      >
        <h2>Helpful tips</h2>
        <p>
          Click on a header field to sort by that field, click again to sort in
          reverse order.
        </p>
        <p>
          The results load 200 at a time, keep scrolling and more will load.
        </p>
        <p>here will go more things</p>
        <p>here will go even. more. things.</p>
        <button
          commandfor="help-dialog"
          command="close"
          id="btn-close"
        >
          x
        </button>
      </dialog>
      <a href="add-edit.html">add or edit</a>
    </header>
    <main>
      <div class="query-options">
        <!-- <h1>LOOKUP</h1> -->
        <div class="query-group">
          <label for="query-format">FORMAT</label>
          <select
            name="format"
            id="query-format"
          >
            <option value=""></option>
            <option value="records">RECORDS</option>
            <option value="tapes">TAPES</option>
            <option value="cds">CDS MAIN</option>
            <option value="cd_compilations">CD COMPILATIONS</option>
            <option value="cd_singles">CD SINGLES</option>
          </select>
        </div>
        <div class="query-group">
          <label for="query-field">FIELD</label>
          <select
            name="field"
            id="query-field"
          >
            <option value=""></option>
          </select>
        </div>
        <div class="query-group">
          <!-- <label for="query-term">SEARCH</label> -->
          <input
            type="text"
            name="term"
            id="query-term"
          />
          <button id="btn-lookup">SEARCH</button>
        </div>
      </div>
      <div id="query-results"></div>
      <p id="message"></p>
    </main>
  </body>
</html>
