<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>The Majewski Collection Lookup</title>
    <link
      rel="stylesheet"
      href="../stylesheets/style.css"
    />
    <link
      rel="stylesheet"
      href="../stylesheets/lookup.css"
    />
    <script
      type="module"
      src="../renderer.js"
      defer
    ></script>
  </head>
  <body id="lookup-body">
    <header>
      <img
        src="../assets/tmc_logo.png"
        alt="the majewski collection"
      />
      <h1>Lookup</h1>
      <button id="btn-help"></button>
      <dialog id="help-dialog">
        <div id="dialog-inner">
          <h2>Helpful tips</h2>
          <p>
            Click on a header field to sort by that field, click again to sort
            in reverse order.
          </p>
          <p>
            The results load 200 at a time, keep scrolling and more will load.
          </p>
          <p>here will go more things</p>
          <p>here will go even. more. things.</p>
          <button id="btn-close">x</button>
        </div>
      </dialog>
      <a href="add-edit.html">add or edit</a>
    </header>
    <main>
      <div class="query-options">
        <div class="query-group">
          <label for="query-format">FORMAT</label>
          <select
            name="format"
            id="query-format"
          >
            <option value=""></option>
            <option value="records">RECORDS</option>
            <option value="tapes">TAPES</option>
            <option value="cds">CDS MAIN</option>
            <option value="cd-compilations">CD COMPILATIONS</option>
            <option value="cd-singles">CD SINGLES</option>
          </select>
        </div>
        <div class="query-group">
          <label for="query-field">FIELD</label>
          <select
            name="field"
            id="query-field"
          >
            <option value=""></option>
          </select>
        </div>
        <div class="query-group">
          <input
            type="text"
            name="term"
            id="query-term"
          />
          <button id="btn-lookup">SEARCH</button>
          <div id="result-qty"></div>
        </div>
      </div>
      <div id="query-results"></div>
      <p id="message"></p>
      <a
        href="#"
        class="back-to-top"
        title="Back To Top"
        tabindex="0"
      >
        <span>></span>
      </a>
    </main>
  </body>
</html>
